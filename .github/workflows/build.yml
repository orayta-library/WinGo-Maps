name: Build UWP App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    env:
      Solution_Name: WinGoMapsX.sln
      Configuration: Release
      Platform: x64
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    - name: Check Windows SDK
      shell: pwsh
      run: |
        Write-Host "Checking for Windows SDK..."
        Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\References" -ErrorAction SilentlyContinue
        Write-Host "MSBuild location:"
        where.exe msbuild
      
    - name: Restore NuGet packages
      run: nuget restore $env:Solution_Name
      
    - name: Restore project dependencies
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:Platform=$env:Platform
      
    - name: Build solution
      run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload /p:GenerateAppxPackageOnBuild=true /p:TargetPlatformVersion=10.0.19041.0
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WinGoMapsX-Package
        path: |
          **/AppPackages/**/*.msix
          **/AppPackages/**/*.appx
          **/AppPackages/**/*.appxbundle
